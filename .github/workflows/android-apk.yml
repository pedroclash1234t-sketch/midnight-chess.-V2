
name: Build Midnight Chess APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PACKAGE_JSON=""

          while IFS= read -r FILE; do
            if node -e '
              const p = require(process.argv[1]);
              process.exit(p.scripts && p.scripts.apk ? 0 : 1);
            ' "$PWD/$FILE" 2>/dev/null; then
              PACKAGE_JSON="$FILE"
              break
            fi
          done < <(find extracted -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/tests/*' \
            -not -path '*/test/*' \
            -not -path '*/android/*' \
            -print)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERRO: package.json principal com script apk não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.dir }}"

          npm install

          echo "Compilando os arquivos web..."

          node --input-type=module -e "import('./scripts/build.mjs').then(({ runBuild }) => runBuild())"

          if [ ! -f dist/index.html ]; then
            echo "ERRO: a compilação não criou dist/index.html."
            echo "Verifique os arquivos src/main.tsx, index.html e public/."
            exit 1
          fi

          echo "Arquivos web criados. Preparando o APK..."

          npm run apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: midnight-chess-apk
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
